# Self-hosted GitHub Actions runners for the cronumstudio organisation: two
# of them, so a pull request's jobs run in parallel. Both carry the label
# `hetzner` and GitHub hands each queued job to whichever is free.
#
# A runner never touches the server's own Docker: its jobs talk to a private
# Docker daemon (dind) of its own, with its own containers, volumes and
# images, so a job can't touch production by accident, and two jobs
# using the same fixed names (`app`, `app-data`) can't clash. Each pair has
# its own network, where its daemon answers as `docker`. All containers have
# CPU and memory caps and a low CPU weight, and all of them share one memory
# budget (ci.slice): under load, production goes first and a runaway build is
# what gets killed. The dind daemons are privileged, so this keeps out
# mistakes, not a hostile job (see README.md).
name: gh-runner

x-runner: &runner
  build: .
  image: gh-runner:local
  restart: unless-stopped
  env_file: .env
  environment: &runner-env
    RUNNER_URL: https://github.com/cronumstudio
    RUNNER_LABELS: hetzner
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
    ACTIONS_RUNNER_HOOK_JOB_STARTED: /usr/local/bin/job-started.sh
    ACTIONS_RUNNER_HOOK_JOB_COMPLETED: /usr/local/bin/job-completed.sh
  cpus: 1.0
  cpu_shares: 256
  # npm ci and a test server together passed 640 MB (OOM kills on 14/11): what
  # protects production is ci.slice, the budget all four containers share.
  mem_limit: 1200m
  memswap_limit: 1400m
  cgroup_parent: ci.slice
  # If the server itself ever runs out of memory, the kernel kills CI first.
  oom_score_adj: 500
  logging: &logging
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

x-dind: &dind
  image: docker:dind
  restart: unless-stopped
  privileged: true
  environment:
    # TLS on 2376, reachable only on the pair's network: no port is
    # published. dind writes the client certificates its runner reads.
    DOCKER_TLS_CERTDIR: /certs
  cpus: 1.5
  cpu_shares: 256
  mem_limit: 1g
  memswap_limit: 1280m
  cgroup_parent: ci.slice
  oom_score_adj: 500
  logging: *logging

services:
  runner:
    <<: *runner
    environment:
      <<: *runner-env
      RUNNER_NAME: hetzner-ci
    volumes:
      - state:/state
      - home:/home/runner
      - work:/home/runner/_work
      - tmp:/tmp
      - certs:/certs/client:ro
    networks: [ci-1]
    depends_on: [dind]

  dind:
    <<: *dind
    volumes:
      - dind:/var/lib/docker
      # Same path as in the runner, so bind mounts of the workspace resolve.
      - work:/home/runner/_work
      - certs:/certs/client
    networks:
      ci-1:
        # dind's own certificate is issued for the name `docker`.
        aliases: [docker]

  runner-2:
    <<: *runner
    environment:
      <<: *runner-env
      RUNNER_NAME: hetzner-ci-2
    volumes:
      - state-2:/state
      - home-2:/home/runner
      - work-2:/home/runner/_work
      - tmp-2:/tmp
      - certs-2:/certs/client:ro
    networks: [ci-2]
    depends_on: [dind-2]

  dind-2:
    <<: *dind
    volumes:
      - dind-2:/var/lib/docker
      - work-2:/home/runner/_work
      - certs-2:/certs/client
    networks:
      ci-2:
        aliases: [docker]

networks:
  ci-1:
  ci-2:

# Everything a job can fill lives on /srv/ci, a disk of its own with a fixed size (see
# ci-disk.sh): the runners' home (npm cache, logs, self-updates), their workspace and /tmp,
# and each Docker's images and build cache. When it is full, CI fails; production, on the
# server's own disk, never notices. Only the registration (state) and dind's certificates
# stay on the server's disk: a few kilobytes. The bind targets exist only while /srv/ci is
# mounted, so if it isn't, the CI containers don't start rather than write to the server's disk.
x-ci-disk: &ci-disk
  driver: local
  driver_opts: &ci-bind { type: none, o: bind }

volumes:
  state:
  certs:
  state-2:
  certs-2:
  home:
    <<: *ci-disk
    driver_opts: { <<: *ci-bind, device: /srv/ci/disk/home }
  work:
    <<: *ci-disk
    driver_opts: { <<: *ci-bind, device: /srv/ci/disk/work }
  tmp:
    <<: *ci-disk
    driver_opts: { <<: *ci-bind, device: /srv/ci/disk/tmp }
  dind:
    <<: *ci-disk
    driver_opts: { <<: *ci-bind, device: /srv/ci/disk/dind }
  home-2:
    <<: *ci-disk
    driver_opts: { <<: *ci-bind, device: /srv/ci/disk/home-2 }
  work-2:
    <<: *ci-disk
    driver_opts: { <<: *ci-bind, device: /srv/ci/disk/work-2 }
  tmp-2:
    <<: *ci-disk
    driver_opts: { <<: *ci-bind, device: /srv/ci/disk/tmp-2 }
  dind-2:
    <<: *ci-disk
    driver_opts: { <<: *ci-bind, device: /srv/ci/disk/dind-2 }
