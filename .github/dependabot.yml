# Keeps the actions the shared workflows pin by commit up to date (6/11 audit, deps-ci-3):
# a pin by SHA can't be moved by whoever controls the action's tags, and this proposes
# each new release as a pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
