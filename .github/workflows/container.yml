# Reusable container checks: builds the calling repository's image, starts it
# on an empty volume and checks the suite's container conventions:
#
# - it answers /health from inside, the same way its HEALTHCHECK does;
# - the app runs as an unprivileged user, never as root;
# - the umask is 077 and every file it wrote in /data is private to it;
# - the application code in /app is read-only for it;
# - the entrypoint refuses a DATA_DIR outside /data and a PUID or PGID of 0;
# - the app refuses to start without BASE_URL (the images run in production)
#   or with an old variable name, and says which variable is wrong;
# - it passes suite-core's conformance checks (tools/conformance.js, from
#   suite-core 0.29), signed in as a throwaway administrator.
#
# The image is built for the runner's architecture only and never pushed. It
# runs with BASE_URL at its own port, which production requires, and an
# administrator whose random password exists only during the job.
#
# Usage, from the calling repository:
#
#   jobs:
#     container:
#       uses: cronumstudio/.github/.github/workflows/container.yml@main
name: Container checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  container:
    # Private repositories run on the organisation's own runner when the
    # CI_RUNNER variable names its label (see ci-runner/); public ones, and
    # everything once the variable is removed, on GitHub's machines.
    runs-on: ${{ (github.event.repository.private && vars.CI_RUNNER) || 'ubuntu-latest' }}
    env:
      IMAGE: app:ci
      ADMIN_USER: conformance
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build the image
        run: docker build -t "$IMAGE" .

      - name: Its port, its address and a throwaway administrator
        run: |
          port="$(docker image inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$IMAGE" | sed -n 's/^PORT=//p')"
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "BASE_URL=http://127.0.0.1:${port:-3000}" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Start it on an empty volume
        run: docker run -d --name app -e BASE_URL -e ADMIN_USER -e ADMIN_PASSWORD -v app-data:/data "$IMAGE"

      - name: Wait for /health
        run: |
          for _ in $(seq 1 30); do
            if docker exec app sh -c 'wget -qO- "http://127.0.0.1:${PORT}/health"' >/dev/null 2>&1; then
              echo "The container answers /health."
              exit 0
            fi
            sleep 2
          done
          echo "No answer from /health after 60 s."
          docker logs app
          exit 1

      # From inside the container, where BASE_URL (its own port) answers.
      - name: Conformance with the suite
        run: |
          if ! docker exec app test -f server/suite/tools/conformance.js; then
            echo "This app's suite-core has no conformance checks yet (they come with 0.29)."
            exit 0
          fi
          docker exec -e CONFORMANCE_USER="$ADMIN_USER" -e CONFORMANCE_PASSWORD="$ADMIN_PASSWORD" app \
            node server/suite/tools/conformance.js "$BASE_URL"

      - name: The app does not run as root
        run: |
          uid="$(docker exec app awk '/^Uid:/ { print $2 }' /proc/1/status)"
          echo "PID 1 runs with uid $uid."
          [ "$uid" != "0" ]

      - name: Files in /data are private to the app
        run: |
          umask="$(docker exec app awk '/^Umask:/ { print $2 }' /proc/1/status)"
          echo "umask of PID 1: $umask"
          [ "$umask" = "0077" ]
          docker exec app node -e '
            const fs = require("node:fs"), path = require("node:path");
            const open = [];
            const walk = (dir) => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(full);
                else if (fs.statSync(full).mode & 0o077) open.push(full);
              }
            };
            walk("/data");
            if (open.length) {
              console.log("Readable by others:", open.join(", "));
              process.exit(1);
            }
            console.log("Every file in /data is private to the app.");
          '

      # `docker exec` enters as root by default, so it takes the app's own
      # uid and gid from PID 1.
      - name: The application code is read-only
        run: |
          ids="$(docker exec app awk '/^Uid:/ { u = $2 } /^Gid:/ { g = $2 } END { print u ":" g }' /proc/1/status)"
          if docker exec -u "$ids" app sh -c 'touch /app/package.json /app/.write-test' 2>/dev/null; then
            echo "The app can write over its own code in /app."
            exit 1
          fi
          echo "/app is read-only for the app ($ids)."

      # The safe values must start, or a refusal below would prove nothing.
      - name: The entrypoint refuses unsafe settings
        run: |
          starts() {
            if ! docker run --rm "$@" "$IMAGE" true; then
              echo "Did not start with ${*:-the defaults}."
              exit 1
            fi
            echo "Starts: ${*:-the defaults}"
          }
          starts
          starts -e PUID= -e PGID=
          starts -e PUID=1026 -e PGID=100
          starts -e DATA_DIR=/data/sub
          refuses() {
            if docker run --rm "$@" "$IMAGE" true >/dev/null 2>&1; then
              echo "Started with $*, and it should have refused."
              exit 1
            fi
            echo "Refused: $*"
          }
          refuses -e DATA_DIR=/app
          refuses -e DATA_DIR=/data/../app
          refuses -e PUID=0
          refuses -e PUID=1000 -e PGID=0
          refuses -e PUID=node

      # The app itself this time, not `true`: it must stop at once and name the
      # variable, instead of running on a guess or on an old name.
      - name: The app refuses a missing BASE_URL or an old variable name
        run: |
          stops() {
            variable="$1"; shift
            docker run -d --name probe "$@" "$IMAGE" >/dev/null
            if ! code="$(timeout 30 docker wait probe)"; then
              docker rm -f probe >/dev/null
              echo "Still running after 30 s with ${*:-no BASE_URL}, and it should have stopped."
              exit 1
            fi
            log="$(docker logs probe 2>&1)"
            docker rm -f probe >/dev/null
            if [ "$code" = "0" ] || ! printf '%s' "$log" | grep -q "$variable"; then
              echo "With ${*:-no BASE_URL}: exit $code, and the log doesn't name $variable:"
              printf '%s\n' "$log" | tail -n 20
              exit 1
            fi
            echo "Stops and names $variable: ${*:-no BASE_URL}"
          }
          stops BASE_URL
          stops PUBLIC_URL -e BASE_URL -e PUBLIC_URL=http://localhost
          stops HOST_PORT -e BASE_URL -e PORT_HOST=3000

      - name: Logs
        if: always()
        run: docker logs app 2>&1 | tail -n 50 || true
