# Reusable secret scan: looks for keys, tokens and passwords in the whole git
# history of the calling repository with gitleaks.
#
# The binary is downloaded from the gitleaks release and checked against its
# published SHA-256 before it runs. Findings are redacted in the log. A
# repository can tune the rules with its own `.gitleaks.toml`, or silence a
# known false positive with `.gitleaksignore`, both at its root.
#
# Usage, from the calling repository:
#
#   jobs:
#     secrets:
#       uses: cronumstudio/.github/.github/workflows/secret-scan.yml@main
name: Secret scan

on:
  workflow_call:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the whole history, not just the last commit

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLo "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner .
