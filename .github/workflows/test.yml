# Reusable test job for the suite's apps and suite-core.
#
# Runs `npm test` with the submodules checked out (server/suite is
# suite-core) and, when the repository defines an `i18n` script, the catalog
# parity check too: keys, placeholders and plural forms in every language.
# Most apps have nothing to install (no dependencies, and SQLite comes inside
# Node); a repository with a package-lock.json gets `npm ci` first.
#
# On a pull request from a branch of the calling repository itself (not from
# a fork), a second job (commit-emails) checks the author and committer email
# of every commit the pull request adds, merge commits included: each must
# match the `allowed-emails` regular expression, by default GitHub's noreply
# addresses. A commit pushed to a public repository can't be taken back, so
# the organization's own branches only ever carry addresses that are meant to
# be public. Pull requests from forks are not checked: their authors choose
# which address they publish.
#
# Usage, from the calling repository:
#
#   jobs:
#     test:
#       uses: cronumstudio/.github/.github/workflows/test.yml@main
#
# The checks it reports are `test / test` and, on pull requests from the
# repository's own branches, `test / commit-emails`.
name: Test

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to test with.
        type: string
        default: '24'
      allowed-emails:
        description: >-
          Perl-compatible regular expression (as `grep -P` reads it, in the C
          locale). On a pull request from a branch of the calling repository,
          every author and committer email of its commits must match it. The
          default allows GitHub's noreply addresses only. An empty string turns
          the check off.
        type: string
        default: '(?i)^([^@\s]+@users\.noreply\.github\.com|noreply@github\.com)$'

permissions:
  contents: read

jobs:
  test:
    # Private repositories run on the organisation's own runner when the
    # CI_RUNNER variable names its label (see ci-runner/); public ones, and
    # everything once the variable is removed, on GitHub's machines.
    runs-on: ${{ (github.event.repository.private && vars.CI_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # no token left in .git/config for later steps
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}

      # Most apps have no dependencies; one with a lockfile gets exactly those.
      - name: Install dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The tests start their own servers on temporary databases.
      - run: npm test

      - name: Look for an i18n script
        id: i18n
        run: |
          if node -e "process.exit(require('./package.json').scripts?.i18n ? 0 : 1)"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No i18n script in package.json: catalog parity skipped."
          fi
      - name: Check catalog parity
        if: steps.i18n.outputs.present == 'true'
        run: npm run i18n

  commit-emails:
    # Only the repository's own branches: a fork's head repository is another one.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      inputs.allowed-emails != ''
    # Same runner choice as the test job above.
    runs-on: ${{ (github.event.repository.private && vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # no token left in .git/config for later steps
          # Every commit of every branch, but no trees or blobs: the whole
          # graph for any range, merge commits included, at a fraction of a
          # full clone.
          fetch-depth: 0
          filter: tree:0
      - name: Check author and committer emails
        shell: bash
        env:
          ALLOWED: ${{ inputs.allowed-emails }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LC_ALL: C   # grep -P needs a unibyte or UTF-8 locale; C is always there
        run: |
          # GitHub tests a pull request on a merge of its head into the tip of
          # the base branch, and that merge is what is checked out: its first
          # parent is the base, its second the head. Between them lies every
          # commit the pull request adds. The base SHA of the event is only the
          # fallback: it can lag behind the branch.
          head=$(git rev-parse --verify "${HEAD_SHA}^{commit}")
          if [ "$(git rev-parse -q --verify 'HEAD^2^{commit}' || true)" = "$head" ]; then
            base=$(git rev-parse --verify 'HEAD^1^{commit}')
          else
            base=$(git rev-parse --verify "${BASE_SHA}^{commit}")
          fi

          status=0
          grep -qP -- "$ALLOWED" < /dev/null || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::allowed-emails is not a valid Perl-compatible regular expression."
            exit 1
          fi

          # Raw addresses (%ae, %ce), never the .mailmap ones: a .mailmap in
          # the branch must not be able to hide an address.
          lines=$(git log --no-use-mailmap --format='%H author %ae%n%H committer %ce' "${base}..${head}")
          commits=$(git rev-list --count "${base}..${head}")
          found=0
          while read -r sha role email; do
            [ -n "$sha" ] || continue
            # An empty address, or a grep that fails for any reason, counts
            # as not allowed.
            if ! grep -qP -- "$ALLOWED" <<< "$email"; then
              # The address itself stays out of the log: it is what must not spread.
              echo "::error::Commit ${sha:0:12}: its ${role} email doesn't match allowed-emails."
              found=$((found + 1))
            fi
          done <<< "$lines"

          if [ "$found" -gt 0 ]; then
            echo "::error::${found} author or committer email(s) in this pull request don't match allowed-emails (by default, GitHub noreply addresses only). Set git's user.email to an allowed address, rewrite those commits (git commit --amend --reset-author, or a rebase with --exec), and force-push the branch."
            exit 1
          fi
          echo "Checked ${commits} commit(s) in ${base:0:12}..${head:0:12}: every email is allowed."
