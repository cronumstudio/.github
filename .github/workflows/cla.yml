# Reusable Contributor License Agreement check: a pull request can only be merged once its
# authors have signed CLA.md (in this repository), by commenting on it as the bot asks. The
# signatures are kept in the calling repository, in signatures/cla.json on the branch
# `cla-signatures`, which must exist; nothing outside GitHub is involved. Cronum Studio's own
# accounts and bots don't sign.
#
# Usage, from the calling repository (.github/workflows/cla.yml):
#
#   on:
#     pull_request_target:
#       types: [opened, synchronize, reopened, closed]
#     issue_comment:
#       types: [created]
#   permissions:
#     contents: write        # writes the signatures
#     pull-requests: write   # comments on the pull request
#     actions: write         # runs the check again after a signature
#     statuses: write
#   jobs:
#     cla:
#       uses: cronumstudio/.github/.github/workflows/cla.yml@main
#
# pull_request_target runs with the base repository's token and never checks out the pull
# request's code, so a fork can't use it to run anything.
name: CLA

on:
  workflow_call:

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && (
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' ||
        github.event.comment.body == 'recheck'))
    # Private repositories run on the organisation's own runner when the CI_RUNNER variable
    # names its label (see ci-runner/); public ones on GitHub's machines.
    runs-on: ${{ (github.event.repository.private && vars.CI_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/cronumstudio/.github/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: martinandersen84,dependabot[bot],github-actions[bot],claude[bot],cronum-studio[bot]
          lock-pullrequest-aftermerge: false
