name: Feature request
description: Suggest an idea or an improvement.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Please search the existing issues first. If you'd like to build it yourself, wait for an answer here before you start: see [CONTRIBUTING.md](https://github.com/cronumstudio/.github/blob/main/CONTRIBUTING.md). Everything here is public, so leave out anything personal; and anyone, Cronum Studio included, may use the ideas posted here.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work, from the point of view of someone using it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - Tasks
        - Projects
        - Next
        - Notes
        - Sign-in, accounts or settings
        - Sharing
        - AI assistant connection (MCP)
        - Installing or running it
        - Something else, or not sure
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself, once the approach is agreed.
